<!-- Universal Navigation for main site (hides in complex agent dashboards) -->
@if (!hideNavbar) {
  <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
    <div class="max-auto max-w-7xl px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
        <div class="w-8 h-8 bg-clinical-blue rounded-lg flex items-center justify-center">
          <div class="w-3 h-3 bg-white rounded-full"></div>
        </div>
        <span class="font-bold text-xl tracking-tight">AgentMinds</span>
      </div>
      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center gap-6">
        <a class="text-sm font-medium text-clinical-gray hover:text-clinical-dark transition-colors cursor-pointer" routerLink="/" fragment="beneficios">Beneficios</a>
        <a class="text-sm font-medium text-clinical-gray hover:text-clinical-dark transition-colors cursor-pointer" routerLink="/blog">Blog</a>
        <a class="text-sm font-medium text-clinical-gray hover:text-clinical-dark transition-colors cursor-pointer" routerLink="/about">Nosotros</a>
        
        <div class="flex items-center gap-4 ml-4 pl-4 border-l border-gray-200">
          <button (click)="openContact()" class="bg-clinical-blue text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all cursor-pointer">
            Solicitar Demo
          </button>
        </div>
      </div>
    </div>
  </nav>
}

<!-- Landing page always visible, mobile frame overlays it for abandoned cart -->
@if (isAbandonedCartRoute) {
  <app-landing-page class="landing-background"></app-landing-page>
}
<router-outlet></router-outlet>
