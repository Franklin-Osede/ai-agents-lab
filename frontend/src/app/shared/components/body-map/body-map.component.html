<div class="relative w-full max-w-[300px] mx-auto transition-all animate-fadeIn">
    <!-- View Switcher (Optional, logic handled by parent usually but good for debugging) -->
    
    <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto drop-shadow-xl filter">
        <!-- SILHOUETTE DEFINITON -->
        <defs>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- FRONT VIEW -->
        @if (view === 'front') {
            <g class="body-front">
                <!-- HEAD -->
                <path (click)="selectPart('Cabeza')" 
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M100,50 C115,50 120,65 120,80 C120,95 110,105 100,105 C90,105 80,95 80,80 C80,65 85,50 100,50 Z" />
                
                <!-- TORSO -->
                <path (click)="selectPart('Pecho')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M80,105 L120,105 L130,120 L130,180 L120,200 L80,200 L70,180 L70,120 Z" />
                
                <!-- ARMS -->
                <path (click)="selectPart('Brazo Izquierdo')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M130,120 L150,130 L160,180 L150,190 L130,180" />
                
                <path (click)="selectPart('Brazo Derecho')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M70,120 L50,130 L40,180 L50,190 L70,180" />

                <!-- LEGS -->
                 <path (click)="selectPart('Pierna Izquierda')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M100,200 L120,200 L120,300 L110,350 L100,300 Z" />

                 <path (click)="selectPart('Pierna Derecha')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M100,200 L80,200 L80,300 L90,350 L100,300 Z" />
                      
                 <!-- KNEES (Specific Detail for this specific case) -->
                 <circle (click)="selectPart('Rodilla Izquierda')" cx="110" cy="270" r="8" class="body-part fill-slate-300 hover:fill-red-500 hover:cursor-pointer transition-colors stroke-white stroke-1" />
                 <circle (click)="selectPart('Rodilla Derecha')" cx="90" cy="270" r="8" class="body-part fill-slate-300 hover:fill-red-500 hover:cursor-pointer transition-colors stroke-white stroke-1" />

            </g>
        }

        <!-- BACK VIEW -->
        @if (view === 'back') {
             <g class="body-back">
                <!-- HEAD BACK -->
                <path (click)="selectPart('Nuca')" 
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M100,50 C115,50 120,65 120,80 C120,95 110,105 100,105 C90,105 80,95 80,80 C80,65 85,50 100,50 Z" />
                
                <!-- BACK -->
                <path (click)="selectPart('Espalda')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M80,105 L120,105 L130,120 L130,180 L120,200 L80,200 L70,180 L70,120 Z" />
                 
                <!-- LUMBAR -->
                <path (click)="selectPart('Lumbares')"
                      class="body-part hover:fill-red-500 hover:cursor-pointer transition-colors fill-slate-300 stroke-white stroke-2"
                      d="M80,180 L120,180 L120,200 L80,200 Z" />

                <!-- LEGS BACK -->
                 <path (click)="selectPart('Gemelo Izquierdo')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M100,200 L120,200 L120,300 L110,350 L100,300 Z" />

                 <path (click)="selectPart('Gemelo Derecho')"
                      class="body-part hover:fill-indigo-500 hover:cursor-pointer transition-colors fill-slate-200 stroke-white stroke-2"
                      d="M100,200 L80,200 L80,300 L90,350 L100,300 Z" />
            </g>
        }
    </svg>
    
    <div class="absolute top-4 right-4 flex flex-col gap-2">
        <button (click)="view = 'front'" [class.bg-indigo-600]="view==='front'" [class.text-white]="view==='front'" class="size-8 rounded-full bg-slate-200 flex items-center justify-center transition-colors">F</button>
        <button (click)="view = 'back'" [class.bg-indigo-600]="view==='back'" [class.text-white]="view==='back'" class="size-8 rounded-full bg-slate-200 flex items-center justify-center transition-colors">E</button>
    </div>
</div>
